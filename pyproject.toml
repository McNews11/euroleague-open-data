[project]
name = "euroleague-open-data"
version = "0.1.0"
description = "Open EuroLeague/EuroCup basketball warehouse and MCP server. Unofficial, not affiliated with Euroleague Basketball."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "mcp[cli]>=1.2",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.scripts]
euroleague-etl = "euroleague_open_data.cli:main"
euroleague-mcp = "euroleague_open_data.mcp_server:main"
euroleague-mcp-http = "euroleague_open_data.server_http:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/euroleague_open_data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
